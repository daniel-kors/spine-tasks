[project]
name = "answer-validator"
version = "0.1.0"
description = "Independent validation of generated answers and source citations"
readme = "README.md"
authors = [
    { name = "daniel-kors", email = "kors.daniels@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
]

[project.scripts]
answer-validator = "answer_validator.__main__:main"

[project.optional-dependencies]
llm = [
    "openai>=1,<3",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: проверка с настоящей внешней библиотекой",
    "llm: проверка с настроенной языковой моделью",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
