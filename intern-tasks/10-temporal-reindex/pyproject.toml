[project]
name = "temporal-reindex"
version = "0.1.0"
description = "Reliable long-running reindex orchestration with Temporal"
readme = "README.md"
authors = [
    { name = "daniel-kors", email = "kors.daniels@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "temporalio>=1.8,<2",
]

[project.scripts]
temporal-reindex-worker = "temporal_reindex.worker:main"
temporal-reindex-start = "temporal_reindex.starter:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: проверка с настоящей внешней библиотекой",
    "llm: проверка с настроенной языковой моделью",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
